<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOVA TECH - Web Development, Mobile Apps, AI, Cyber Security and Cloud Solutions.">
    <meta name="author" content="NOVA TECH">
    <title>NOVA TECH | Innovative Software Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Apply the saved theme before paint; dark is the default unless light was selected. -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('nova-theme');
          document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Vue replaces everything inside this element. -->
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
